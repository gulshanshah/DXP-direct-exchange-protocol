name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (GCC, release + sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: bash build.sh
      - name: Build and test with ASan/UBSan
        run: bash build.sh asan

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: cmd
        run: build.bat
